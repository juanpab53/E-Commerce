spring.application.name=PruebaE-Commerce

# Supabase (PostgreSQL) connection
spring.datasource.url= ${SPRING_DATASOURCE_URL}
spring.datasource.username= ${SPRING_DATASOURCE_USERNAME}
spring.datasource.password= ${SPRING_DATASOURCE_PASSWORD}

# PostgreSQL driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JSON format for API responses
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET_KEY}
app.jwt.expiration-minutes=${JWT_EXPIRATION}

# CORS (single source of truth in SecurityConfig)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}
app.cors.allow-credentials=${APP_CORS_ALLOW_CREDENTIALS:false}

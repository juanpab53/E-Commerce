# Test configuration (shadows main application.properties during tests).
# Self-contained: no environment variables required.

# H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway configuration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JSON format for API responses
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Configuration (throwaway test values; secret must decode to >= 32 bytes)
app.jwt.secret=owXpC9NJID+tIWc9WrjSMCINy+bphlb8laaXYGtbwX0=
app.jwt.expiration-minutes=60

# CORS (single source of truth in SecurityConfig)
app.cors.allowed-origins=*
app.cors.allow-credentials=false

name: Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

  pull_request:
    branches: [develop, main]
    paths:
      - "backend/**"

jobs:
  test-and-coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "maven"

      - name: Run tests and generate report
        env:
          SPRING_DATASOURCE_URL: ${{ secrets.SUPABASE_DB_URL }}
          SPRING_DATASOURCE_USERNAME: ${{ secrets.SUPABASE_DB_USER }}
          SPRING_DATASOURCE_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: mvn -f backend/pom.xml clean verify

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./backend/target/site/jacoco/jacoco.xml
          slug: juanpab53/E-Commerce
          fail_ci_if_error: true
